[package]
name = "gnx-control"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
age = { version = "0.12.1", default-features = false }
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[profile.release]
strip = "symbols"
