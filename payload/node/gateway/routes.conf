# Capacidad: gateway
# Implementación aprobada para este release: Caddy
# app.gnx es estático; compute valida backend por HTTPS.
# Los dashboards de workload entran por el gateway privado y llegan al LXC por mesh.
{
  # Gateway certificate/key and backend CA are operator-managed files mounted read-only.
  auto_https disable_redirects
  # Remote mobile clients are authorized for TCP 443 only. Do not advertise
  # HTTP/3/QUIC on UDP 443 and then strand them after the TLS warning.
  servers {
    protocols h1 h2
  }
}
https://app.gnx {
  tls /etc/gnx/ca/gateway-cert.pem /etc/gnx/ca/gateway-key.pem
  root * /srv/gnx-web
  encode gzip
  header {
    Alt-Svc "clear"
    Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' https://api.github.com; form-action 'none'"
    Referrer-Policy "no-referrer"
    Strict-Transport-Security "max-age=31536000"
    X-Content-Type-Options "nosniff"
  }
  header Cache-Control "no-store, private"
  route {
    # The sole public former-PWA asset is a retirement worker: no app shell or
    # runtime data. Old installed workers must update even without a session.
    @worker path /sw.js
    handle @worker {
      file_server
    }
    @signedout path /signed-out
    handle @signedout {
      header Clear-Site-Data "\"cache\", \"storage\""
      rewrite * /signed-out.html
      root * /srv/gnx-auth-public
      file_server
    }
    @logout {
      path /logout
      method POST
      header Origin https://app.gnx
    }
    handle @logout {
      header Clear-Site-Data "\"cache\", \"storage\""
      rewrite * /oauth2/sign_out?rd=https%3A%2F%2Fapp.gnx%2Fsigned-out
      reverse_proxy 127.0.0.1:4180 {
        header_up Host app.gnx
        header_up X-Forwarded-Proto https
        header_up X-Forwarded-Host app.gnx
        header_up -Authorization
      }
    }
    # Never expose direct sign_out redirects or the proxy's bypass/health APIs.
    @internal path /logout /oauth2/sign_out /oauth2/auth /oauth2/userinfo /ping /ready
    respond @internal 404
    # One backend owns auth AND file serving. No unprotected file_server fallback.
    reverse_proxy 127.0.0.1:4180 {
      header_up Host app.gnx
      header_up X-Forwarded-Proto https
      header_up X-Forwarded-Host app.gnx
      header_up -Authorization
      header_up -X-Auth-Request-User
      header_up -X-Auth-Request-Email
      header_up -X-Auth-Request-Groups
      header_up -X-Forwarded-User
      header_up -X-Forwarded-Email
      header_up -X-Forwarded-Groups
    }
  }
}
# RustFS retains its own Tailscale sidecar and native TLS. The backend-only
# DNS record avoids sending the gateway back to its public rustfs.gnx entry.
https://rustfs.gnx {
  tls /etc/gnx/ca/rustfs-cert.pem /etc/gnx/ca/rustfs-key.pem
  header Alt-Svc "clear"
  reverse_proxy https://rustfs.mesh.gnx:443 {
    # Caddy 2.11 rewrites Host for HTTPS upstreams by default. SigV4 binds
    # the original Host, so preserve it for console login and signed API calls.
    header_up Host {http.request.host}
    transport http {
      resolvers 127.0.0.1:5353
      tls_trust_pool file /etc/gnx/ca/gateway-ca.pem
      tls_server_name rustfs.gnx
      dial_timeout 5s
    }
  }
}
https://pocket.gnx {
  tls /etc/gnx/ca/gateway-cert.pem /etc/gnx/ca/gateway-key.pem
  header Alt-Svc "clear"
  reverse_proxy http://pocket.mesh.gnx:1411 {
    transport http {
      resolvers 127.0.0.1:5353
      dial_timeout 5s
    }
  }
}
https://netbird.gnx {
  tls /etc/gnx/ca/gateway-cert.pem /etc/gnx/ca/gateway-key.pem
  header Alt-Svc "clear"
  # Upstream combined-server routing: gRPC must use h2c; preserve path prefixes.
  @grpc path /signalexchange.SignalExchange/* /management.ManagementService/* /management.ProxyService/*
  handle @grpc {
    reverse_proxy h2c://netbird.mesh.gnx:8081 {
      transport http {
        versions h2c 1.1
        resolvers 127.0.0.1:5353
        dial_timeout 5s
      }
    }
  }
  @backend path /api /api/* /oauth2 /oauth2/* /relay /relay/* /ws-proxy/*
  handle @backend {
    reverse_proxy http://netbird.mesh.gnx:8081 {
      transport http {
        resolvers 127.0.0.1:5353
        dial_timeout 5s
      }
    }
  }
  handle {
    reverse_proxy http://netbird.mesh.gnx:8080 {
      transport http {
        resolvers 127.0.0.1:5353
        dial_timeout 5s
      }
    }
  }
}
# Per-app confidential OAuth clients live on separate loopback ports/cookies.
# The official account BYOP proxy remains the verified TLS backend.
(gnx_ai_backend) {
  reverse_proxy https://ai.mesh.gnx:8443 {
    header_up Host {http.request.host}
    header_up -Authorization
    # Pocket authenticates the browser at the gateway. The account proxy uses
    # a protected backend credential, not a second conflicting OAuth callback.
    header_up -X-GnX-Backend-Key
    import /etc/gnx/ai-auth/backend*.caddy
    transport http {
      resolvers 127.0.0.1:5353
      # The LXC presents its own Tailscale-issued certificate. System public
      # roots and exact mesh DNS verification; never disable TLS validation.
      tls_server_name {$GNX_AI_TLS_NAME:ai.invalid}
      dial_timeout 5s
    }
  }
}
(gnx_service_auth) {
  tls /etc/gnx/ca/{args[2]}-cert.pem /etc/gnx/ca/{args[2]}-key.pem
  header Alt-Svc "clear"
  header Cache-Control "no-store, private"
  header Referrer-Policy "no-referrer"
  route {
    @internal path /oauth2/auth /oauth2/userinfo /oauth2/sign_out /ping /ready
    respond @internal 404
    @oauth path /oauth2/*
    handle @oauth {
      reverse_proxy 127.0.0.1:{args[0]} {
        header_up X-Forwarded-Proto https
        header_up X-Forwarded-Host {http.request.host}
        header_up -Authorization
      }
    }
    handle {
      forward_auth 127.0.0.1:{args[0]} {
        uri /oauth2/auth
        header_up X-Forwarded-Proto https
        header_up X-Forwarded-Host {http.request.host}
        header_up -Authorization
        @denied status 401
        handle_response @denied {
          redir /oauth2/start?rd={http.request.uri} 302
        }
      }
      import {args[1]}
    }
  }
}
https://voice.ai.gnx {
  import gnx_service_auth 4181 gnx_ai_backend ai
}
https://ai.gnx {
  tls /etc/gnx/ca/ai-cert.pem /etc/gnx/ca/ai-key.pem
  header Alt-Svc "clear"
  redir https://app.gnx/#ai-title 302
}
https://oryx.ai.gnx {
  import gnx_service_auth 4182 gnx_ai_backend ai
}
https://omniroute.ai.gnx {
  import gnx_service_auth 4183 gnx_ai_backend ai
}
https://continuity.ai.gnx {
  import gnx_service_auth 4184 gnx_ai_backend ai
}
(gnx_business_backend) {
  @business_root path /
  redir @business_root /health/ready 302
  reverse_proxy http://continuity.mesh.gnx:7310 {
    header_up -Authorization
    header_up -X-Auth-Request-User
    header_up -X-Auth-Request-Groups
    transport http {
      resolvers 127.0.0.1:5353
      dial_timeout 5s
    }
  }
}
https://continuity.gnx {
  import gnx_service_auth 4185 gnx_business_backend gateway
}
https://continuty.gnx {
  tls /etc/gnx/ca/gateway-cert.pem /etc/gnx/ca/gateway-key.pem
  header Alt-Svc "clear"
  redir https://continuity.gnx{uri} 307
}
https://proxy.gnx {
  tls /etc/gnx/ca/ai-cert.pem /etc/gnx/ca/ai-key.pem
  header Alt-Svc "clear"
  import gnx_ai_backend
}
https://compute.gnx {
  tls /etc/gnx/ca/gateway-cert.pem /etc/gnx/ca/gateway-key.pem
  header Alt-Svc "clear"
  reverse_proxy https://127.0.0.1:8006 {
    transport http {
      tls_trust_pool file /etc/gnx/ca/backend-ca.pem
      tls_server_name compute.gnx
    }
  }
}
