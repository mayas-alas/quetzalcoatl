# WSL supports nf_tables but lacks legacy ip6_tables and ebtables filter.
# Upstream selects legacy in ExecStartPre; append supported alternatives.
# Preserve the working IPv4 backend and keep PVE firewall enabled.
[Service]
ExecStartPre=/usr/bin/update-alternatives --set ip6tables /usr/sbin/ip6tables-nft
ExecStartPre=/usr/bin/update-alternatives --set ebtables /usr/sbin/ebtables-nft
