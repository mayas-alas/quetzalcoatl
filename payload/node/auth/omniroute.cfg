# Public settings only. install.run adds the protected Redis credential.
provider = "oidc"
provider_display_name = "Pocket ID"
skip_provider_button = true
prompt = "login"
oidc_issuer_url = "https://pocket.gnx"
provider_ca_files = ["/etc/gnx/ca/gateway-ca.pem"]
redirect_url = "https://omniroute.ai.gnx/oauth2/callback"
client_secret_file = "/etc/gnx/auth/client.secret"
cookie_secret_file = "/etc/gnx/auth/cookie.secret"
scope = "openid profile email groups offline_access"
code_challenge_method = "S256"
insecure_oidc_skip_nonce = false
# Authorize the immutable signed Pocket subject and group, not mailbox ownership.
# Pocket passkey users may legitimately emit email_verified=false.
# No identity/email headers or tokens are forwarded to this static application.
oidc_email_claim = "sub"
email_domains = ["*"]
allowed_groups = ["gnx-app-users"]
oidc_groups_claim = "groups"
http_address = "127.0.0.1:4183"
reverse_proxy = true
upstreams = ["static://202"]
set_xauthrequest = true
pass_access_token = false
pass_authorization_header = false
pass_basic_auth = false
pass_user_headers = false
set_authorization_header = false
skip_jwt_bearer_tokens = false
cookie_name = "__Host-GnX-OmniRoute-Session"
cookie_path = "/"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "15m"
cookie_refresh = "1m"
cookie_csrf_per_request = true
cookie_csrf_expire = "5m"
session_store_type = "redis"
redis_connection_url = "redis://127.0.0.1:6380/0"
whitelist_domains = ["omniroute.ai.gnx"]
request_logging = false
auth_logging = false
standard_logging = false
show_debug_on_error = false
footer = "Acceso privado GnX. Se requiere el grupo gnx-app-users."
