# Copy this reviewed file to .github/workflows/ in the private repository.
# It supports workflow_call and workflow_dispatch; the latter is what gnx-actions.sh uses.
name: GnX ephemeral exit node

on:
  workflow_call:
    inputs:
      lease_minutes:
        description: Maximum lease in minutes (1..350)
        required: false
        type: number
        default: 60
      request_id:
        description: Caller correlation id
        required: false
        type: string
        default: ''
    secrets:
      TAILSCALE_AUTHKEY:
        required: true
    outputs:
      result:
        description: Final machine-readable lease result
        value: ${{ jobs.exit-node.outputs.result }}
  workflow_dispatch:
    inputs:
      lease_minutes:
        description: Maximum lease in minutes (1..350)
        required: true
        type: string
        default: '60'
      request_id:
        description: Caller correlation id
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  exit-node:
    # This hard ceiling is intentionally not configurable by callers.
    timeout-minutes: 350
    runs-on: ubuntu-24.04
    outputs:
      result: ${{ steps.result.outputs.result }}
    env:
      REQUEST_LEASE_MINUTES: ${{ inputs.lease_minutes || '60' }}
      REQUEST_ID: ${{ inputs.request_id || '' }}
      TAILSCALE_VERSION: '1.102.4'
      TAILSCALE_ARCHIVE_SHA256: '50748df1045e60b5b695f19f4c56b0da36c019948b440fb456b6584a50f0d8b9'
    steps:
      # A private-repository checkout is deliberate: this workflow never runs code
      # fetched from an untrusted repository or from a mutable branch elsewhere.
      - name: Bootstrap private repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate lease configuration
        id: config
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$REQUEST_LEASE_MINUTES" =~ ^[0-9]+$ ]] || { echo 'lease_minutes must be an integer' >&2; exit 64; }
          (( REQUEST_LEASE_MINUTES >= 1 && REQUEST_LEASE_MINUTES <= 350 )) || { echo 'lease_minutes must be 1..350' >&2; exit 64; }
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._-]{0,96}$ ]] || { echo 'request_id contains unsafe characters' >&2; exit 64; }
          printf 'lease_minutes=%s\n' "$REQUEST_LEASE_MINUTES" >> "$GITHUB_OUTPUT"
          printf 'request_id=%s\n' "$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Install pinned Tailscale adapter
        id: tailscale-install
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/tailscale-${TAILSCALE_VERSION}.tgz"
          extract="$RUNNER_TEMP/tailscale-${TAILSCALE_VERSION}"
          url="https://pkgs.tailscale.com/stable/tailscale_${TAILSCALE_VERSION}_amd64.tgz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" "$url"
          printf '%s  %s\n' "$TAILSCALE_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$extract"
          tar --extract --gzip --file "$archive" --directory "$extract" --strip-components=1
          [[ -x "$extract/tailscale" && -x "$extract/tailscaled" ]] || { echo 'Tailscale archive layout changed' >&2; exit 1; }
          sudo install -m 0755 "$extract/tailscale" /usr/local/bin/tailscale
          sudo install -m 0755 "$extract/tailscaled" /usr/local/bin/tailscaled
          tailscale version

      - name: Start ephemeral exit node
        id: lease
        shell: bash
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -Eeuo pipefail
          secret_file="$RUNNER_TEMP/gnx-tailscale-authkey"
          socket="$RUNNER_TEMP/gnx-tailscaled.sock"
          # GitHub masks the secret expression; the file is still made private so
          # tailscale can consume it via file: without putting it in argv.
          (umask 077; printf '%s\n' "$TAILSCALE_AUTHKEY" > "$secret_file")
          unset TAILSCALE_AUTHKEY
          trap 'rm -f -- "$secret_file" "$socket"' EXIT
          sudo tailscaled --state=mem: --socket="$socket" >/dev/null 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true; rm -f -- "$secret_file" "$socket"' EXIT
          for _ in {1..30}; do
            [[ -S "$socket" ]] && break
            sleep 1
          done
          [[ -S "$socket" ]] || { echo 'tailscaled did not start' >&2; exit 1; }
          sudo sysctl -w net.ipv4.ip_forward=1 net.ipv6.conf.all.forwarding=1 >/dev/null
          hostname="gnx-exit-${GITHUB_RUN_ID}"
          sudo tailscale --socket="$socket" up --auth-key="file:$secret_file" \
            --hostname="$hostname" --advertise-exit-node --accept-routes=false --ssh=false
          ip=$(sudo tailscale --socket="$socket" ip -4 | head -n 1)
          [[ "$ip" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || { echo 'Tailscale did not return an IPv4 address' >&2; exit 1; }
          sudo tailscale --socket="$socket" status --json | jq -e '.BackendState == "Running"' >/dev/null
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 20 https://example.com/ >/dev/null
          echo 'GNX_EXIT_NODE_READY'
          issued_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          expires_at=$(date -u -d "+${REQUEST_LEASE_MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ)
          ready=$(jq -cn --arg state ready --arg ip "$ip" --arg issued_at "$issued_at" \
            --arg expires_at "$expires_at" --arg lease_minutes "$REQUEST_LEASE_MINUTES" \
            --arg request_id "$REQUEST_ID" --arg run_id "$GITHUB_RUN_ID" \
            '{ok:true,state:$state,tailscale_ip:$ip,issued_at:$issued_at,expires_at:$expires_at,lease_minutes:($lease_minutes|tonumber),request_id:$request_id,run_id:($run_id|tonumber)}')
          printf '%s\n' "$ready"
          printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
          deadline=$(( $(date +%s) + REQUEST_LEASE_MINUTES * 60 ))
          while (( $(date +%s) < deadline )); do
            sleep 15
          done

      - name: Emit machine-readable result
        id: result
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state='expired'
          if [[ '${{ steps.lease.outcome }}' != 'success' ]]; then state='failed'; fi
          result=$(jq -cn --arg state "$state" --arg lease_minutes "$REQUEST_LEASE_MINUTES" \
            --arg request_id "$REQUEST_ID" --arg run_id "$GITHUB_RUN_ID" \
            '{ok:($state == "expired"),state:$state,lease_minutes:($lease_minutes|tonumber),request_id:$request_id,run_id:($run_id|tonumber)}')
          printf '%s\n' "$result"
          printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"
