name: Package Windows installers

on:
  workflow_call:
    inputs:
      cli_mode:
        type: string
        default: ''
      payload_release:
        type: string
        default: ''
      payload_sha256:
        type: string
        default: ''
      publish_release:
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.package.outputs.version }}

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 90
    # Inherited write access is needed only for the explicitly gated draft paths.
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      REQUESTED_CLI_MODE: ${{ inputs.cli_mode }}
      REQUESTED_PAYLOAD_RELEASE: ${{ inputs.payload_release }}
      REQUESTED_PAYLOAD_SHA256: ${{ inputs.payload_sha256 }}
      REQUESTED_PUBLICATION: ${{ inputs.publish_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false

      - name: Resolve event-specific build configuration
        run: |
          $config = ./scripts/resolve-installer-config.ps1 -EventName $env:GITHUB_EVENT_NAME -Ref $env:GITHUB_REF -CliMode $env:REQUESTED_CLI_MODE -PayloadRelease $env:REQUESTED_PAYLOAD_RELEASE -PayloadSha256 $env:REQUESTED_PAYLOAD_SHA256 -PublishRelease:($env:REQUESTED_PUBLICATION -eq 'true')
          "CLI_MODE=$($config.CliMode)" >> $env:GITHUB_ENV
          "OUTPUT_ROOT=$($config.OutputRoot)" >> $env:GITHUB_ENV
          "PAYLOAD_RELEASE=$($config.PayloadRelease)" >> $env:GITHUB_ENV
          "PAYLOAD_SHA256=$($config.PayloadSha256)" >> $env:GITHUB_ENV
          "PAYLOAD_BYTES=$($config.PayloadBytes)" >> $env:GITHUB_ENV

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0, Node 24
        with:
          dotnet-version: '8.0.x'

      - name: Check packaging prerequisites
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          $drive = (Get-Item $env:GITHUB_WORKSPACE).PSDrive
          if ($drive.Free -lt 12GB) { throw "Packaging requires at least 12 GiB free on $($drive.Name): ($([math]::Round($drive.Free / 1GB, 1)) GiB available); use a runner with more space, no validation will be skipped" }
          $metadata = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'gnx').version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid package version' }
          if ($env:CLI_MODE -notin @('versioned', 'source', 'preview')) { throw 'Invalid CLI mode' }
          if (-not (Test-Path -LiteralPath "releases/v$version/CHANGELOG.md" -PathType Leaf)) { throw 'Versioned changelog missing' }
          $binary = "releases/v$version/gnx.exe"
          if ($env:CLI_MODE -eq 'versioned' -and -not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw 'Versioned CLI missing; select source for a new version'
          }
          if ($env:CLI_MODE -eq 'source' -and (Test-Path -LiteralPath $binary)) {
            throw 'Source mode requires a new version without an existing canonical CLI; never replace an immutable version'
          }
          if ($env:REQUESTED_PUBLICATION -eq 'true' -and ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:GITHUB_REF -cne "refs/tags/v$version")) {
            throw 'Publication requires a manual run on the tag matching the workspace version'
          }
          "GNX_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download and verify offline inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PAYLOAD_RELEASE -notmatch '^[a-zA-Z0-9][a-zA-Z0-9._-]*$') { throw 'Invalid input release tag' }
          if ($env:PAYLOAD_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'Invalid archive SHA256' }
          $archive = Join-Path $env:RUNNER_TEMP 'gnx-offline-inputs.zip'
          gh release download $env:PAYLOAD_RELEASE --pattern gnx-offline-inputs.zip --output $archive
          if ($LASTEXITCODE -ne 0) { throw 'Offline input download failed' }
          if ([long]$env:PAYLOAD_BYTES -gt 0 -and (Get-Item -LiteralPath $archive).Length -ne [long]$env:PAYLOAD_BYTES) { throw 'Pinned offline input archive size mismatch' }
          ./scripts/prepare-ci-payload.ps1 -Archive $archive -Sha256 $env:PAYLOAD_SHA256 -Preview:($env:CLI_MODE -eq 'preview')
          Remove-Item -LiteralPath $archive

      - name: Prepare pinned official Console asset
        run: |
          $ErrorActionPreference = 'Stop'
          $console = Get-Content config/console.json -Raw | ConvertFrom-Json
          if ($console.path -notmatch '^console/rustfs-console-v[0-9]+\.[0-9]+\.[0-9]+\.zip$' -or $console.sha256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid pinned Console metadata' }
          if ($console.url -ne "https://github.com/rustfs/console/releases/download/$($console.version)/rustfs-console-$($console.version).zip") { throw 'Unexpected Console origin' }
          $destination = Join-Path $PWD "build/payload/$($console.path)"
          New-Item -ItemType Directory -Force (Split-Path $destination -Parent) | Out-Null
          Invoke-WebRequest -Uri $console.url -OutFile $destination
          if ((Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant() -ne $console.sha256) { throw 'Official Console asset SHA-256 mismatch' }

      - name: Prepare pinned Go toolchain for Tailcat
        if: ${{ env.CLI_MODE == 'source' || env.CLI_MODE == 'preview' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'go-1.27.1-gnx'
          New-Item -ItemType Directory -Path $directory | Out-Null
          $archive = Join-Path $directory 'go.zip'
          Invoke-WebRequest -Uri 'https://go.dev/dl/go1.27.1.windows-amd64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a3911b5e0e1b1053f25ed0675f4c1c6aad1e2bfcf253df2b9be4caabd2edd95d') {
            throw 'Official Go archive SHA-256 mismatch'
          }
          tar.exe -xf $archive -C $directory
          if ($LASTEXITCODE -ne 0) { throw 'Go toolchain extraction failed' }
          "GNX_GO=$(Join-Path $directory 'go/bin/go.exe')" >> $env:GITHUB_ENV
          Remove-Item -LiteralPath $archive

      - name: Check Rust sources
        if: ${{ env.CLI_MODE == 'source' || env.CLI_MODE == 'preview' }}
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed' }
          cargo clippy --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Rust static analysis failed' }
          cargo test --locked --bin gnx windows::recreation::checks
          if ($LASTEXITCODE -ne 0) { throw 'Inventory content normalization checks failed' }

      - name: Report remaining packaging capacity after source analysis
        run: |
          $drive = (Get-Item $env:GITHUB_WORKSPACE).PSDrive
          "Remaining packaging space: $([math]::Round($drive.Free / 1GB, 1)) GiB on $($drive.Name):" >> $env:GITHUB_STEP_SUMMARY

      - name: Compile and package a new CLI with canonical gates
        if: ${{ env.CLI_MODE == 'source' }}
        run: ./scripts/build.ps1 -Package

      - name: Compile pushed sources and package an isolated preview with canonical gates
        if: ${{ env.CLI_MODE == 'preview' }}
        run: ./scripts/build.ps1 -Package -Preview

      - name: Package the immutable versioned CLI with canonical gates
        if: ${{ env.CLI_MODE == 'versioned' }}
        run: ./scripts/build.ps1 -Package -UseVersionedBinary

      - name: Separate user downloads from build metadata
        run: |
          $ErrorActionPreference = 'Stop'
          $output = "$env:OUTPUT_ROOT/v$env:GNX_VERSION"
          $installers = Join-Path $PWD "$output/installers"
          $metadata = Join-Path $PWD "$output/metadata"
          New-Item -ItemType Directory -Path $installers, $metadata | Out-Null
          foreach ($name in 'GnxCore.msi', 'GnxCoreSetup.exe') {
            Move-Item -LiteralPath (Join-Path $output $name) -Destination $installers
          }
          $lines = foreach ($name in 'GnxCore.msi', 'GnxCoreSetup.exe') {
            $file = Get-Item -LiteralPath (Join-Path $installers $name)
            if ($file.Length -eq 0) { throw "Empty output: $name" }
            "$((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $name"
          }
          [IO.File]::WriteAllText((Join-Path $installers 'SHA256SUMS.txt'), ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          $metadataFiles = @('base-image.digest')
          if ($env:CLI_MODE -ne 'preview') { $metadataFiles += 'gnx.exe' }
          foreach ($name in $metadataFiles) {
            Copy-Item -LiteralPath (Join-Path $output $name) -Destination $metadata
          }
          Copy-Item -LiteralPath (Join-Path $output 'build-provenance.json') -Destination (Join-Path $metadata 'canonical-build-provenance.json')
          Copy-Item -LiteralPath (Join-Path $installers 'SHA256SUMS.txt') -Destination (Join-Path $metadata 'INSTALLER-SHA256SUMS.txt')
          $head = git rev-parse --short=12 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify packaged source commit' }
          $stageRoot = if ($env:CLI_MODE -eq 'preview') { 'build/package/preview' } else { 'build/package' }
          Copy-Item -LiteralPath "$stageRoot/v$env:GNX_VERSION-$head/payload/manifest.json" -Destination $metadata
          Copy-Item -LiteralPath "releases/v$env:GNX_VERSION/CHANGELOG.md" -Destination $metadata
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify build commit' }
          $rustc = rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify Rust toolchain' }
          $cargo = cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify Cargo toolchain' }
          $provenance = @{
            version = $env:GNX_VERSION
            source_commit = $commit
            cli_mode = $env:CLI_MODE
            compiled_from_source = ($env:CLI_MODE -in @('source', 'preview'))
            preview = ($env:CLI_MODE -eq 'preview')
            event = $env:GITHUB_EVENT_NAME
            payload_release = $env:PAYLOAD_RELEASE
            payload_sha256 = $env:PAYLOAD_SHA256
            payload_bytes = [long]$env:PAYLOAD_BYTES
            workflow_run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            runner_rustc = ($rustc -join "`n")
            runner_cargo = $cargo
          }
          [IO.File]::WriteAllText((Join-Path $metadata 'build-provenance.json'), ($provenance | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
          $technicalHashes = foreach ($name in ($metadataFiles + @('manifest.json', 'CHANGELOG.md', 'build-provenance.json', 'canonical-build-provenance.json', 'INSTALLER-SHA256SUMS.txt'))) {
            "$((Get-FileHash -LiteralPath (Join-Path $metadata $name) -Algorithm SHA256).Hash.ToLowerInvariant())  $name"
          }
          [IO.File]::WriteAllText((Join-Path $metadata 'BUILD-SHA256SUMS.txt'), ($technicalHashes -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          if ($env:CLI_MODE -eq 'preview') {
            if ((Get-ChildItem -LiteralPath $metadata -File | Measure-Object Length -Sum).Sum -gt 1MB) { throw 'Preview validation metadata exceeds the 1 MiB Actions artifact budget' }
            "Pushed sources compiled and MSI/EXE verified as a preview; no canonical CLI adoption or public release publication." >> $env:GITHUB_STEP_SUMMARY
          } elseif ($env:CLI_MODE -eq 'source') {
            "CLI compiled from source and MSI/EXE packaged with canonical gates. Preserve the generated canonical CLI from technical metadata for local reuse." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "MSI/EXE packaged from the immutable versioned CLI; source recompilation was not executed." >> $env:GITHUB_STEP_SUMMARY
          }
          "CLI mode: $env:CLI_MODE. Installation and runtime acceptance were not executed." >> $env:GITHUB_STEP_SUMMARY
          "## Technical build hashes (not user downloads)" >> $env:GITHUB_STEP_SUMMARY
          [IO.File]::ReadAllText((Join-Path $metadata 'BUILD-SHA256SUMS.txt')).TrimEnd() >> $env:GITHUB_STEP_SUMMARY
          [IO.File]::ReadAllText((Join-Path $metadata 'build-provenance.json')) >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve small preview validation metadata
        if: ${{ github.event_name == 'push' && env.CLI_MODE == 'preview' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gnx-preview-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}/v${{ env.GNX_VERSION }}/metadata/
          if-no-files-found: error
          retention-days: 1

      - name: Preserve canonical CLI and technical provenance
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gnx-technical-v${{ env.GNX_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}/v${{ env.GNX_VERSION }}/metadata/
          if-no-files-found: error
          retention-days: 30

      - name: Stage unique unpublished main candidate (installers and checksums only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLI_MODE == 'preview' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/stage-preview-release.ps1

      - name: Stage user draft release (installers and checksums only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && env.CLI_MODE != 'preview' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ env.GNX_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:CLI_MODE -notin @('source', 'versioned') -or $env:GITHUB_REF -cne "refs/tags/$env:RELEASE_TAG") { throw 'Draft staging is manual-only on the matching version tag' }
          $tagCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:RELEASE_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:GITHUB_SHA) { throw 'Version tag does not match the packaged commit' }
          # Artifact storage is account-scoped and limited; the ~3 GB installers do
          # not fit the included quota. Staging hands over through a draft release,
          # whose assets do not count against Actions artifact storage.
          $pages = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Listing releases failed' }
          $stale = @(foreach ($page in $pages) { foreach ($item in $page) { $item } })
          if (@($stale | Where-Object { $_.tag_name -eq $env:RELEASE_TAG -and (-not $_.draft -or $_.immutable) }).Count -gt 0) { throw 'Published/immutable release already exists; refusing replacement' }
          foreach ($candidate in $stale) {
            if ($candidate.draft -and $candidate.tag_name -eq $env:RELEASE_TAG) {
              gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($candidate.id)" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'A stale draft release could not be removed; refusing to stage a duplicate' }
              Write-Host "Removed stale draft $($candidate.id)"
            }
          }
          $installers = Join-Path $PWD "$env:OUTPUT_ROOT/v$env:GNX_VERSION/installers"
          foreach ($name in 'GnxCore.msi', 'GnxCoreSetup.exe', 'SHA256SUMS.txt') {
            $file = Get-Item -LiteralPath (Join-Path $installers $name)
            if ($file.Length -eq 0) { throw "Empty draft asset: $name" }
          }
          $changelog = [IO.File]::ReadAllText("releases/v$env:GNX_VERSION/CHANGELOG.md")
          $notes = "$changelog`n`n## Procedencia`n`nCommit: ``$env:GITHUB_SHA```n`n[Empaquetado en GitHub Actions]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID). El empaquetado no acredita aceptacion en un host nuevo.`n"
          if ($env:CLI_MODE -eq 'source') {
            $notes += "`nCLI compilado desde fuentes en esta ejecucion.`n"
          } else {
            $notes += "`nCLI versionado reutilizado; esta ejecucion no recompilo las fuentes.`n"
          }
          $notes += "`nWorkflow identity: $env:GITHUB_RUN_ID`n"
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notesFile, $notes, [Text.UTF8Encoding]::new($false))
          gh release create $env:RELEASE_TAG --verify-tag --draft --prerelease --target $env:GITHUB_SHA `
            --title "GnX Core $env:RELEASE_TAG — Windows x64 (candidata)" --notes-file $notesFile `
            "$installers/GnxCoreSetup.exe#Instalador interactivo — recomendado" `
            "$installers/GnxCore.msi#Paquete MSI — administracion" `
            "$installers/SHA256SUMS.txt#SHA-256 de los instaladores"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release staging failed' }
