name: Windows installers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cli_mode:
        description: 'CLI origin: reuse the immutable versioned binary or compile a new version from source'
        required: true
        default: versioned
        type: choice
        options:
          - versioned
          - source
      payload_release:
        description: 'Release tag containing gnx-offline-inputs.zip in this repository'
        required: true
        type: string
      payload_sha256:
        description: 'SHA-256 of the complete offline input ZIP'
        required: true
        type: string
      publish_release:
        description: 'Publish installers as a prerelease (requires matching version tag)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Keep candidate and official release writes serialized across all refs/tags.
# GitHub's max queue retains up to 100 pending runs instead of replacing one.
concurrency:
  group: installers-release-writes
  cancel-in-progress: false
  queue: max

jobs:
  automatic:
    if: ${{ github.event_name == 'push' }}
    permissions:
      # The same runner stages the large installers as an unpublished candidate;
      # handing them to another job would require multi-GiB Actions artifacts.
      contents: write
    uses: ./.github/workflows/package-windows.yml

  package:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    uses: ./.github/workflows/package-windows.yml
    with:
      cli_mode: ${{ inputs.cli_mode }}
      payload_release: ${{ inputs.payload_release }}
      payload_sha256: ${{ inputs.payload_sha256 }}
      publish_release: ${{ inputs.publish_release }}

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v${{ needs.package.outputs.version }}
    steps:
      - name: Verify staged draft assets, tag and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
          drafts=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
            jq -s --arg tag "$RELEASE_TAG" '[.[][] | select(.draft and .tag_name == $tag)]')
          [[ $(echo "$drafts" | jq 'length') -eq 1 ]]
          draft=$(echo "$drafts" | jq -r '.[0].id')
          meta=$(gh api "repos/$GH_REPO/releases/$draft")
          echo "$meta" | jq -e --arg tag "$RELEASE_TAG" --arg commit "$GITHUB_SHA" \
            --arg run "Workflow identity: $GITHUB_RUN_ID" \
            '.draft == true and .immutable != true and .tag_name == $tag and .target_commitish == $commit and (.body | split("\n") | index($run) != null)' >/dev/null
          echo "$meta" | jq -e '.assets | length == 3' >/dev/null
          names=$(echo "$meta" | jq -r '[.assets[].name] | sort | join("\n")')
          [[ "$names" == "$(printf 'GnxCore.msi\nGnxCoreSetup.exe\nSHA256SUMS.txt' | sort)" ]]
          mkdir installers
          echo "$meta" | jq -r '.assets[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id asset; do
            gh api -H 'Accept: application/octet-stream' "repos/$GH_REPO/releases/assets/$id" > "installers/$asset"
          done
          cd installers
          [[ $(find . -maxdepth 1 -type f | wc -l) -eq 3 ]]
          [[ $(wc -l < SHA256SUMS.txt) -eq 2 ]]
          [[ $(grep -c '  GnxCore.msi$' SHA256SUMS.txt) -eq 1 ]]
          [[ $(grep -c '  GnxCoreSetup.exe$' SHA256SUMS.txt) -eq 1 ]]
          if grep -Ev '^[0-9a-f]{64}  (GnxCore\.msi|GnxCoreSetup\.exe)$' SHA256SUMS.txt; then
            echo 'Unexpected entry in user download checksums' >&2
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS.txt
          for f in GnxCore.msi GnxCoreSetup.exe; do
            [[ $(stat -c %s "$f") -gt 0 ]]
          done
          tag_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo 'Version tag does not match this workflow commit; refusing publication' >&2
            exit 1
          fi
          cd ..
          gh api -X PATCH "repos/$GH_REPO/releases/$draft" -F draft=false -F prerelease=true -f make_latest=false > /dev/null
          printf 'Instaladores publicados: %s/%s/releases/tag/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
