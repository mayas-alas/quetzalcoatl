name: Windows installers

on:
  workflow_dispatch:
    inputs:
      cli_mode:
        description: 'CLI origin: reuse the immutable versioned binary or compile a new version from source'
        required: true
        default: versioned
        type: choice
        options:
          - versioned
          - source
      payload_release:
        description: 'Release tag containing gnx-offline-inputs.zip in this repository'
        required: true
        type: string
      payload_sha256:
        description: 'SHA-256 of the complete offline input ZIP'
        required: true
        type: string
      publish_release:
        description: 'Publish installers as a prerelease (requires matching version tag)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      CLI_MODE: ${{ inputs.cli_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0, Node 24
        with:
          dotnet-version: '8.0.x'

      - name: Check packaging prerequisites
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          $drive = (Get-Item $env:GITHUB_WORKSPACE).PSDrive
          if ($drive.Free -lt 12GB) { throw 'Packaging requires at least 12 GiB free; no validation will be skipped' }
          $metadata = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'gnx').version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid package version' }
          if ($env:CLI_MODE -notin @('versioned', 'source')) { throw 'Invalid CLI mode' }
          if (-not (Test-Path -LiteralPath "releases/v$version/CHANGELOG.md" -PathType Leaf)) { throw 'Versioned changelog missing' }
          $binary = "releases/v$version/gnx.exe"
          if ($env:CLI_MODE -eq 'versioned' -and -not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw 'Versioned CLI missing; select source for a new version'
          }
          if ($env:CLI_MODE -eq 'source' -and (Test-Path -LiteralPath $binary)) {
            throw 'Source mode requires a new version without an existing canonical CLI; never replace an immutable version'
          }
          "GNX_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download and verify offline inputs
        env:
          PAYLOAD_RELEASE: ${{ inputs.payload_release }}
          PAYLOAD_SHA256: ${{ inputs.payload_sha256 }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PAYLOAD_RELEASE -notmatch '^[a-zA-Z0-9][a-zA-Z0-9._-]*$') { throw 'Invalid input release tag' }
          if ($env:PAYLOAD_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'Invalid archive SHA256' }
          $archive = Join-Path $env:RUNNER_TEMP 'gnx-offline-inputs.zip'
          gh release download $env:PAYLOAD_RELEASE --pattern gnx-offline-inputs.zip --output $archive
          if ($LASTEXITCODE -ne 0) { throw 'Offline input download failed' }
          ./scripts/prepare-ci-payload.ps1 -Archive $archive -Sha256 $env:PAYLOAD_SHA256
          Remove-Item -LiteralPath $archive

      - name: Prepare pinned official Console asset
        run: |
          $ErrorActionPreference = 'Stop'
          $console = Get-Content config/console.json -Raw | ConvertFrom-Json
          if ($console.path -notmatch '^console/rustfs-console-v[0-9]+\.[0-9]+\.[0-9]+\.zip$' -or $console.sha256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid pinned Console metadata' }
          if ($console.url -ne "https://github.com/rustfs/console/releases/download/$($console.version)/rustfs-console-$($console.version).zip") { throw 'Unexpected Console origin' }
          $destination = Join-Path $PWD "build/payload/$($console.path)"
          New-Item -ItemType Directory -Force (Split-Path $destination -Parent) | Out-Null
          Invoke-WebRequest -Uri $console.url -OutFile $destination
          if ((Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant() -ne $console.sha256) { throw 'Official Console asset SHA-256 mismatch' }

      - name: Check Rust sources
        if: ${{ inputs.cli_mode == 'source' }}
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed' }
          cargo clippy --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Rust static analysis failed' }

      - name: Compile and package a new CLI with canonical gates
        if: ${{ inputs.cli_mode == 'source' }}
        run: ./scripts/build.ps1 -Package

      - name: Package the immutable versioned CLI with canonical gates
        if: ${{ inputs.cli_mode == 'versioned' }}
        run: ./scripts/build.ps1 -Package -UseVersionedBinary

      - name: Separate user downloads from build metadata
        run: |
          $ErrorActionPreference = 'Stop'
          $output = "build/releases/v$env:GNX_VERSION"
          $installers = Join-Path $PWD "$output/installers"
          $metadata = Join-Path $PWD "$output/metadata"
          New-Item -ItemType Directory -Path $installers, $metadata | Out-Null
          foreach ($name in 'GnxCore.msi', 'GnxCoreSetup.exe') {
            Move-Item -LiteralPath (Join-Path $output $name) -Destination $installers
          }
          $lines = foreach ($name in 'GnxCore.msi', 'GnxCoreSetup.exe') {
            $file = Get-Item -LiteralPath (Join-Path $installers $name)
            if ($file.Length -eq 0) { throw "Empty output: $name" }
            "$((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $name"
          }
          [IO.File]::WriteAllText((Join-Path $installers 'SHA256SUMS.txt'), ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          foreach ($name in 'gnx.exe', 'base-image.digest') {
            Copy-Item -LiteralPath (Join-Path $output $name) -Destination $metadata
          }
          $head = git rev-parse --short=12 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify packaged source commit' }
          Copy-Item -LiteralPath "build/package/v$env:GNX_VERSION-$head/payload/manifest.json" -Destination $metadata
          Copy-Item -LiteralPath "releases/v$env:GNX_VERSION/CHANGELOG.md" -Destination $metadata
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify build commit' }
          $rustc = rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify Rust toolchain' }
          $cargo = cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify Cargo toolchain' }
          $provenance = @{
            version = $env:GNX_VERSION
            source_commit = $commit
            cli_mode = $env:CLI_MODE
            compiled_from_source = ($env:CLI_MODE -eq 'source')
            workflow_run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            runner_rustc = ($rustc -join "`n")
            runner_cargo = $cargo
          }
          [IO.File]::WriteAllText((Join-Path $metadata 'build-provenance.json'), ($provenance | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
          $technicalHashes = foreach ($name in 'gnx.exe', 'base-image.digest', 'manifest.json', 'CHANGELOG.md', 'build-provenance.json') {
            "$((Get-FileHash -LiteralPath (Join-Path $metadata $name) -Algorithm SHA256).Hash.ToLowerInvariant())  $name"
          }
          [IO.File]::WriteAllText((Join-Path $metadata 'BUILD-SHA256SUMS.txt'), ($technicalHashes -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          if ($env:CLI_MODE -eq 'source') {
            "CLI compiled from source and MSI/EXE packaged with canonical gates. Preserve the generated canonical CLI from technical metadata for local reuse." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "MSI/EXE packaged from the immutable versioned CLI; source recompilation was not executed." >> $env:GITHUB_STEP_SUMMARY
          }
          "CLI mode: $env:CLI_MODE. Installation and runtime acceptance were not executed." >> $env:GITHUB_STEP_SUMMARY

      - name: Prune artifacts from previous runs to keep Actions storage clean
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          # Hosted runners always start on a fresh VM (docs.github.com/en/actions/reference/runners/github-hosted-runners),
          # so only artifact storage persists across runs. Purge artifacts from older
          # runs to stay within the repository storage quota.
          $removed = 0; $freedBytes = [long]0; $page = 1
          while ($true) {
            $items = @( gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=$page" 2>$null |
              ConvertFrom-Json | ForEach-Object { $_.artifacts } )
            if ($LASTEXITCODE -ne 0) { throw 'Listing artifacts failed' }
            if ($items.Count -eq 0) { break }
            foreach ($artifact in $items) {
              if ($artifact.run_id -lt [long]$env:GITHUB_RUN_ID) {
                gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($artifact.id)" 2>$null
                if ($LASTEXITCODE -eq 0) { $removed++; $freedBytes += [long]$artifact.size_in_bytes }
              }
            }
            $page++
          }
          $pruned = '{0} artifacts from previous runs pruned; freed {1:N0} bytes' -f $removed, $freedBytes
          Write-Host $pruned
          $pruned >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: gnx-core-v${{ env.GNX_VERSION }}-windows-x64
          path: build/releases/v${{ env.GNX_VERSION }}/installers/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload technical metadata (not a portable installation)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: gnx-core-v${{ env.GNX_VERSION }}-build-metadata
          path: build/releases/v${{ env.GNX_VERSION }}/metadata/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: ${{ inputs.publish_release }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v${{ needs.package.outputs.version }}
    steps:
      - name: Download verified build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          name: gnx-core-v${{ needs.package.outputs.version }}-windows-x64
          path: installers

      - name: Download release notes and technical provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          name: gnx-core-v${{ needs.package.outputs.version }}-build-metadata
          path: build-metadata

      - name: Verify hashes and publish prerelease
        working-directory: installers
        shell: bash
        run: |
          set -euo pipefail
          [[ $(find . -maxdepth 1 -type f | wc -l) -eq 3 ]]
          [[ $(wc -l < SHA256SUMS.txt) -eq 2 ]]
          [[ $(grep -c '  GnxCore.msi$' SHA256SUMS.txt) -eq 1 ]]
          [[ $(grep -c '  GnxCoreSetup.exe$' SHA256SUMS.txt) -eq 1 ]]
          if grep -Ev '^[0-9a-f]{64}  (GnxCore\.msi|GnxCoreSetup\.exe)$' SHA256SUMS.txt; then
            echo 'Unexpected entry in user download checksums' >&2
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS.txt
          (cd ../build-metadata && sha256sum --check --strict BUILD-SHA256SUMS.txt)
          jq -e --arg commit "$GITHUB_SHA" --arg version "${RELEASE_TAG#v}" '
            .source_commit == $commit and .version == $version and
            ((.cli_mode == "source" and .compiled_from_source == true) or
             (.cli_mode == "versioned" and .compiled_from_source == false))
          ' ../build-metadata/build-provenance.json >/dev/null
          tag_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo 'Version tag does not match this workflow commit; refusing publication' >&2
            exit 1
          fi
          printf '\n\n## Procedencia\n\nCommit: `%s`\n\n[Empaquetado en GitHub Actions](%s/%s/actions/runs/%s). El empaquetado no acredita aceptación en un host nuevo.\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> ../build-metadata/CHANGELOG.md
          mode=$(jq -er .cli_mode ../build-metadata/build-provenance.json)
          if [[ "$mode" == source ]]; then
            printf '\nCLI compilado desde fuentes en esta ejecución.\n' >> ../build-metadata/CHANGELOG.md
          else
            printf '\nCLI versionado reutilizado; esta ejecución no recompiló las fuentes.\n' >> ../build-metadata/CHANGELOG.md
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "GnX Core $RELEASE_TAG — Windows x64 (candidata)" --notes-file ../build-metadata/CHANGELOG.md 'GnxCoreSetup.exe#Instalador interactivo — recomendado' 'GnxCore.msi#Paquete MSI — administración' 'SHA256SUMS.txt#SHA-256 de los instaladores'
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          printf 'Instaladores publicados: %s/%s/releases/tag/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
