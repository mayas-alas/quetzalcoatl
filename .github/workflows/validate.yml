name: Validate Quetzalcoatl runtime

on:
  workflow_dispatch:
  push:
    branches: [main, master, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate runtime payload
        run: python3 ci/validate_runtime.py
      - name: Check shell payloads
        run: |
          find runtime/payload-v2/bin -type f -print0 | xargs -0 -n1 sh -n
          shellcheck runtime/payload-v2/bin/*
      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust tests
        run: cargo test --workspace --all-targets --locked
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate runtime payload
        shell: pwsh
        run: python ci/validate_runtime.py
      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust tests
        run: cargo test --workspace --all-targets --locked
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Validate installer contracts
        shell: pwsh
        run: ./installer/build.ps1 -TestRebootContractOnly
      - name: Build and verify installer payload coherence
        shell: pwsh
        run: ./installer/build.ps1
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: quetzalcoatl-0.1.10-windows-installer
          path: |
            target/installer/Quetzalcoatl.msi
            target/installer/QuetzalcoatlSetup.exe
          if-no-files-found: error
