[workspace]
resolver = "2"
members = ["crates/control-protocol", "apps/host-agent", "apps/setup"]

[workspace.package]
version = "0.1.72"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
