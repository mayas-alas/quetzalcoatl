[package]
name = "gnx"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Quetzalcoatl Next sovereign runtime orchestrator"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
url = "2.5"
sha2 = "0.11"
getrandom = "0.4"
ureq = { version = "3.4", default-features = false, features = ["platform-verifier", "rustls"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
