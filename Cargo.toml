[package]
name = "quetzalcoatl-gnx"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "quetzalcoatl-gnx"
path = "src/main.rs"

[[bin]]
name = "quetzalcoatl-gnx-setup"
path = "src/setup.rs"

[[bin]]
name = "quetzalcoatl-gnx-tray"
path = "src/tray.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_Security_Cryptography", "Win32_NetworkManagement_NetManagement", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Registry", "Win32_System_LibraryLoader"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
