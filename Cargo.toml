[package]
name = "runtime-control"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "runtime"
path = "src/main.rs"

[[bin]]
name = "runtime-setup"
path = "src/setup.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_Security_Cryptography", "Win32_NetworkManagement_NetManagement", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_Threading", "Win32_System_Memory"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
