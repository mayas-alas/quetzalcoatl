[package]
name = "gnx"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
url = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
base64 = "0.22"
getrandom = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rpassword = "7.5"
serde_json = "1"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
panic = "abort"
strip = "symbols"
