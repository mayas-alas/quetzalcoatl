[package]
name = "gnx"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Private access, HTTPS control and persistent Proxmox compute"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
ipnet = "2"
url = "2"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
lto = "thin"
strip = true
panic = "abort"
