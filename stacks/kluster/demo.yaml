apiVersion: v1
kind: Namespace
metadata:
  name: gnx-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-page
  namespace: gnx-demo
data:
  index.html: |
    <!doctype html><html lang="es"><meta charset="utf-8"><title>GnX Demo</title>
    <h1>GnX Kubernetes</h1><p>Servicio de demo servido desde el registry local.</p></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: gnx-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo}
  template:
    metadata:
      labels: {app: demo}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: 127.0.0.1:5000/gnx/demo:1
          imagePullPolicy: IfNotPresent
          command: [httpd, -f, -p, "8080", -h, /www]
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
          volumeMounts: [{name: page, mountPath: /www, readOnly: true}]
      volumes:
        - name: page
          configMap: {name: demo-page}
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: gnx-demo
spec:
  selector: {app: demo}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic
  namespace: gnx-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: traffic}
  template:
    metadata:
      labels: {app: traffic}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: traffic
          image: 127.0.0.1:5000/gnx/demo:1
          imagePullPolicy: IfNotPresent
          command: [sh, -c, 'while true; do wget -q -O /dev/null http://demo:8080/ || true; sleep 3; done']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
