apiVersion: v1
kind: Namespace
metadata:
  name: gnx-services
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-health-content
  namespace: gnx-services
data:
  index.html: |
    <!doctype html><html lang="es"><meta charset="utf-8"><title>GnX · Estado del servicio</title>
    <h1>Estado del servicio HTTP</h1><p>Servicio disponible para comprobación de conectividad y observabilidad de red.</p></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-health
  namespace: gnx-services
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: service-health}
  template:
    metadata:
      labels: {app.kubernetes.io/name: service-health, app.kubernetes.io/component: http-endpoint, app.kubernetes.io/part-of: gnx-services}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: service-health
          image: 127.0.0.1:5000/gnx/service-health:1
          imagePullPolicy: IfNotPresent
          command: [httpd, -f, -p, "8080", -h, /www]
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
          volumeMounts: [{name: page, mountPath: /www, readOnly: true}]
      volumes:
        - name: page
          configMap: {name: service-health-content}
---
apiVersion: v1
kind: Service
metadata:
  name: service-health
  namespace: gnx-services
spec:
  selector: {app.kubernetes.io/name: service-health}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-probe
  namespace: gnx-services
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: http-probe}
  template:
    metadata:
      labels: {app.kubernetes.io/name: http-probe, app.kubernetes.io/component: availability-check, app.kubernetes.io/part-of: gnx-services}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: http-probe
          image: 127.0.0.1:5000/gnx/service-health:1
          imagePullPolicy: IfNotPresent
          command: [sh, -c, 'while true; do if wget -q -O /dev/null http://service-health:8080/; then echo service_health=available; else echo service_health=unavailable; fi; sleep 5; done']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
