datasources:
  postgres:
    url: jdbc:postgresql://kestra-postgres:5432/kestra
    driver-class-name: org.postgresql.Driver
    username: kestra
    password: "__POSTGRES_PASSWORD__"
kestra:
  server:
    basic-auth:
      username: admin@kestra.gnx
      password: "__ADMIN_PASSWORD__"
  repository:
    type: postgres
  queue:
    type: postgres
  storage:
    type: local
    local:
      base-path: /app/storage
  tasks:
    tmp-dir:
      path: /tmp/kestra-wd/tmp
  url: http://localhost:8080/
  anonymous-usage-report:
    enabled: false
