[package]
name = "gnx-setup"
version.workspace = true
edition.workspace = true

[[bin]]
name = "gnx"
path = "src/main.rs"

[dependencies]
gnx-control-protocol = { path = "../../crates/control-protocol" }
serde_json.workspace = true
uuid.workspace = true
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
