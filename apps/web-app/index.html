<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'none'"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>GnX Node</title></head>
<body><main><p class="eyebrow">GNX NODE</p><h1>Tu nodo, en tu red privada.</h1><p class="lede">Estado y acceso de las capacidades de este nodo.</p><section class="card status-card" aria-labelledby="status-title"><div><span id="status-dot" class="dot pending"></span><strong id="status-title">Comprobando nodo</strong></div><p id="status-message" role="status">Leyendo el último estado del nodo…</p><div class="progress" role="progressbar" aria-labelledby="status-title" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="status-bar"></span></div><p id="status-percent" class="status-percent">0% completado</p><ul id="status-checks" class="checks" aria-label="Comprobaciones del nodo"></ul><p id="status-error" class="status-error" hidden></p><a id="compute-link" class="button" href="https://compute.gnx" hidden>Abrir compute</a></section><p class="note">La vista muestra el último estado confirmado por GnX; no incluye controles administrativos.</p></main><script src="app.js" defer></script></body>
</html>
