[package]
name = "gnx-host-preflight"
version = "0.1.12"
edition.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Threading"] }
winreg = "0.55"
