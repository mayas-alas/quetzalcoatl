[package]
name = "gnx-cli"
version = "0.1.3"
edition.workspace = true

[[bin]]
name = "gnx"
path = "src/main.rs"

[dependencies]
gnx-protocol = { path = "../gnx-protocol" }
serde_json = "1.0"
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_System_Pipes",
] }
