services:
  tailscale:
    image: docker.io/tailscale/tailscale@sha256:2f4584ddb5b8254868f1e2874efa11e7ef1fc554a824ff36e0ab538382e42a8e
    container_name: gnx-forgejo-tailscale
    hostname: ${TS_HOSTNAME:?TS_HOSTNAME is required}
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:41234
      TS_DEBUG_FIREWALL_MODE: nftables
      TS_EXTRA_ARGS: --advertise-tags=tag:quetzalcoatl-service
    volumes:
      - /var/lib/quetzalcoatl/tailscale/forgejo:/var/lib/tailscale
      - ./serve:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  forgejo:
    image: codeberg.org/forgejo/forgejo@sha256:49b5cdd63e2eaab3e3484ffb21a3317e0b782633a2f29672ca295e2c001e6edf
    container_name: gnx-forgejo
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__DOMAIN: ${TS_CERT_DOMAIN:?TS_CERT_DOMAIN is required}
      FORGEJO__server__ROOT_URL: https://${TS_CERT_DOMAIN:?TS_CERT_DOMAIN is required}/
      FORGEJO__server__SSH_DOMAIN: ${TS_CERT_DOMAIN:?TS_CERT_DOMAIN is required}
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /data/gitea/forgejo.db
      FORGEJO__security__SECRET_KEY_URI: file:/run/secrets/forgejo/secret_key
      FORGEJO__security__INTERNAL_TOKEN_URI: file:/run/secrets/forgejo/internal_token
      FORGEJO__service__DISABLE_REGISTRATION: "true"
    volumes:
      - /var/lib/quetzalcoatl/forgejo/data:/data
      - /var/lib/quetzalcoatl/secrets/forgejo:/run/secrets/forgejo:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
