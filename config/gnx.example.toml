version = 1

[host]
distribution = "Ubuntu-24.04"
runtime_dir = "/usr/local/share/gnx/runtime"

[access]
state_dir = "/var/lib/gnx/access"
zone = "gnx"
hostname = "gnx-services"
tag = "tag:gnx-services"
uplink = "eth0"
uplink_mtu = 1500

[[access.services]]
name = "compute"
alias = "compute.gnx"
# Reemplazar con el nombre aprobado del servicio en el tailnet.
fqdn = "compute.example.ts.net"
target = "http://127.0.0.1:8443"

[compute]
state_dir = "/var/lib/gnx/compute"
node = "gnx-compute"
username = "root@pam"
verify_endpoint = "http://127.0.0.1:8443"

[controller]
state_dir = "/var/lib/gnx/controller"
# Conserva HTTPS privado .gnx; nunca instala confianza de forma implícita.
autonomous_ca = true
