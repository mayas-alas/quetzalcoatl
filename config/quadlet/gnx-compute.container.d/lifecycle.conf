[Unit]
PartOf=gnx-core.target
# PVE stops guests natively. No ordering edge to gateway: local app startup
# must never wait for compute availability or its password.

[Container]
LogDriver=journald
StopTimeout=120

[Service]
Restart=on-failure
RestartSec=10s
TimeoutStartSec=120s
TimeoutStopSec=130s
