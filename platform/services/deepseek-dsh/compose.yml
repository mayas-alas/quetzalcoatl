services:
  tailscale:
    image: docker.io/tailscale/tailscale@sha256:2f4584ddb5b8254868f1e2874efa11e7ef1fc554a824ff36e0ab538382e42a8e
    container_name: ${GNX_CONTAINER_PREFIX:?GNX_CONTAINER_PREFIX is required}-tailscale
    hostname: ${TS_HOSTNAME:?TS_HOSTNAME is required}
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:41234
      TS_DEBUG_FIREWALL_MODE: nftables
      TS_TAGS: tag:quetzalcoatl-deepseek-dsh
    volumes:
      - /var/lib/quetzalcoatl/tailscale/deepseek-dsh:/var/lib/tailscale
      - ./serve:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    ports:
      - "127.0.0.1:3080:3080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  deepseek-dsh:
    image: ghcr.io/alliottech/deepseek-harness@sha256:0d87427b7f8109dc3f3e9cae1dcba9ae81f96f3170c5389f408fa1f6bb9d6bd7
    container_name: ${GNX_CONTAINER_PREFIX:?GNX_CONTAINER_PREFIX is required}
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      PORT: "3080"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}"
    volumes:
      - /var/lib/quetzalcoatl/deepseek-dsh/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3080/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped
